# Explicitly define the real driver to delegate to
driverlist=org.postgresql.Driver
# Use slf4j for logging, integrating with the existing logging framework
appender=com.p6spy.engine.spy.appender.Slf4JLogger
# Define the category for SQL logs
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
# Ensure SQL is on a single line for readability
customLogMessageFormat=p6spy | took %(executionTime)ms | %(sqlSingleLine)